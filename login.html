<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cashly</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-logo">
            <h1><i class="fa-brands fa-canadian-maple-leaf"></i>Cashly<span>.</span></h1>
            <p>Take control of your finances.</p>
        </div>
        <div class="auth-form" id="login-view">
            <h2>Welcome Back!</h2>
            <p>Login to access your account.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required>
                </div>
                <button type="submit" class="auth-button">
                    Login
                </button>
            </form>

            <p class="auth-switch">Don't have an account?
                <a href="#" id="show-register">Register</a>
            </p>
        </div>

        <div class="auth-form" id="register-view" hidden>
            <h2>Create an Account</h2>
            <p>Join Cashly and start managing your money.</p>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text"
                    id="register-name"
                    placeholder="Enter your full name"
                    required>
                </div>

                <div class="form-group">
                    <label for="register-email">Email Address</label>
                    <input type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password"
                    id="register-password"
                    placeholder="Create a password"
                    minlength="6"
                    required>
                </div>
                <button type="button" class="auth-button">Create Account</button>
            </form>
            <p class="auth-switch">
                Already have an account?
                <a href="#" id="show-login">Login</a>
            </p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
